{% extends 'store/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 border rounded p-4 bg-light">
        <h3 class="mb-3">Login into account</h3>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary w-100">Log in</button>
        </form>
        <p class="mt-3 text-center">Don't have an account yet? <a href="{% url 'users:register' %}">Sign up</a></p>
    </div>
</div>
{% endblock %}
