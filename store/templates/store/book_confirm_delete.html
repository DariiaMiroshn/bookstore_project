{% extends 'store/base.html' %}
{% block content %}
<h2>Delete Book</h2>
<p>Are you sure you want to delete "{{ object.title }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a href="{% url 'store:book_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
