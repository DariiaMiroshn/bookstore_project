<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}BookStore{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-3">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 rounded px-3">
        <a class="navbar-brand fw-bold" href="{% url 'store:book_list' %}">BookStore</a>

        <div class="navbar-nav me-auto">
            <a class="nav-link text-white" href="{% url 'store:book_list' %}">Catalog</a>
            {% if perms.store.add_book %}
                <a class="nav-link text-white" href="{% url 'store:book_create' %}">+ Add Book</a>
            {% endif %}
        </div>

        <div class="navbar-nav">
            {% if user.is_authenticated %}
                <span class="nav-link text-white me-2">Hello, <strong>{{ user.username }}</strong>!</span>
                <form method="post" action="{% url 'users:logout' %}" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-light btn-sm">Log Out</button>
                </form>
            {% else %}
                <a class="nav-link text-white" href="{% url 'users:login' %}">Log In</a>
                <a class="btn btn-light btn-sm ms-2" href="{% url 'users:register' %}">Register</a>
            {% endif %}
        </div>
    </nav>

    <main>
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
