{% extends 'store/base.html' %}

{% block content %}
<div class="border rounded p-4 bg-light">
    <h3>{{ book.title }}</h3>
    <p class="text-muted">Author: {{ book.author }} | Category: {{ book.category.name }}</p>
    <hr>
    <p>{{ book.description }}</p>
    <p><strong>Price:</strong> {{ book.price }} UAH</p>
    <p><strong>In stock:</strong> {{ book.stock }} pcs.</p>

    <div class="mt-4">
        <a href="{% url 'store:book_update' book.pk %}" class="btn btn-warning me-2">Edit</a>
        <a href="{% url 'store:book_delete' book.pk %}" class="btn btn-danger">Delete</a>
        <a href="{% url 'store:book_list' %}" class="btn btn-outline-secondary float-end">Back to list</a>
    </div>
</div>
{% endblock %}
